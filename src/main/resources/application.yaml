spring:
  application:
    name: gestion_scolaire_backend

  datasource:

    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestion_scolaire_db}}

    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Base NEUVE (prod cible) : mettre JPA_DDL_AUTO=validate et FLYWAY_ENABLED=true.
      #   -> Flyway crée le schéma (db/migration/V1..Vn), Hibernate se contente de le valider.
      # Base EXISTANTE (déploiement Render actuel) : laisser "update" et FLYWAY_ENABLED=false.
      ddl-auto: ${JPA_DDL_AUTO:update}
    # Journalisation SQL désactivée par défaut (bruit + coût en production).
    # Activer en local avec JPA_SHOW_SQL=true.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}

  # Migrations de schéma versionnées (src/main/resources/db/migration).
  # Désactivé par défaut pour ne pas heurter une base déjà créée par Hibernate.
  # Sur une base neuve : FLYWAY_ENABLED=true (+ JPA_DDL_AUTO=validate).
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: false
    locations: classpath:db/migration

  # Configuration de l'email via Brevo SMTP (utilisant des variables d'environnement avec valeurs par défaut)
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Taille max des uploads (photos de profil).
spring.servlet.multipart:
  max-file-size: 6MB
  max-request-size: 8MB

# Stockage d'objets — Cloudflare R2 (S3-compatible).
# Si storage.r2.enabled=false : l'upload de photos renvoie une erreur claire,
# les photos base64 déjà en base continuent de s'afficher.
storage:
  r2:
    enabled: ${R2_ENABLED:false}
    account-id: ${R2_ACCOUNT_ID:}
    access-key: ${R2_ACCESS_KEY_ID:}
    secret-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:}
    # URL publique de lecture du bucket (r2.dev ou domaine perso), sans slash final.
    public-base-url: ${R2_PUBLIC_BASE_URL:}

# Configuration du port de l'application backend
server:
  port: ${PORT:8089}

# Sonde de santé (Render health check, monitoring uptime).
# Seul /actuator/health est exposé ; aucun détail (pas de fuite d'infos infra).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
  health:
    # Indicateurs non critiques pour servir les requêtes : on ne veut pas que
    # /actuator/health passe DOWN (et que Render redémarre le service en boucle)
    # juste parce que le relais SMTP est injoignable ou lent.
    mail:
      enabled: false
    ssl:
      enabled: false
    # La base reste critique : si `db` est DOWN, /actuator/health doit l'être.

jwt:
  # OBLIGATOIRE : aucune valeur par défaut. L'application refuse de démarrer si JWT_SECRET
  # est absent, trop court (< 32 caractères) ou égal à la valeur d'exemple publique.
  # Générer : openssl rand -base64 48
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# URL du frontend (utilisée dans les liens de réinitialisation)
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  password-reset-token-expiry-minutes: 30
  cors:
    # Origines autorisées (séparées par des virgules). À définir explicitement en production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://gestion-scolaire-admin.vercel.app}
